<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Rutinas</title>
    <link rel="stylesheet" href="css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="container">
    <h1>DELTA <span>CLUB</span></h1>

    <div class="controls">
        <div class="control-group">
        <label for="numBloques">Cantidad de Bloques:</label>
        <select id="numBloques">
            <option value="1">1 Bloque</option>
            <option value="2">2 Bloques</option>
            <option value="3" selected>3 Bloques</option>
            <option value="4">4 Bloques</option>
        </select>
        </div>

        <div id="bloquesConfig" class="bloques-config"></div>

        <button id="btnGenerar">Armar Rutina Aleatoria</button>
    </div>

    <div id="resultado" class="rutina-grid"></div>
</div>

<script src="js/script.js"></script>
</body>
</html>
